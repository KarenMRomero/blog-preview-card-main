<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <div class="content">
        <article class="card" aria-label="Blog preview card">
          <div class="img-container">
            <img
              src="./assets/images/illustration-article.svg"
              alt="Illustration representing web development with coding symbols"
            />
          </div>
          <div class="topic"><p>Learning</p></div>
          <header>
            <time class="date"></time>
            <h1 class="title">HTML & CSS foundations</h1>
          </header>
          <div class="description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </div>
          <div class="author">
            <div class="photo">
              <img
                src="./assets/images/image-avatar.webp"
                alt="Photo of Greg Hooper author of the article"
              />
            </div>
            <div class="name">Greg Hooper</div>
          </div>
        </article>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">KarenMRomero</a>.
    </footer>
    <script>
      const dateElement = document.querySelector(".date");
      const today = new Date();
      const options = { year: "numeric", month: "long", day: "numeric" };
      const formattedDate = today.toLocaleDateString("en-US", options);
      const isoDate = today.toISOString().split("T")[0]; // formato YYYY-MM-DD
      dateElement.textContent = `Published ${formattedDate}`;
      dateElement.setAttribute("datetime", isoDate);
    </script>
  </body>
</html>
