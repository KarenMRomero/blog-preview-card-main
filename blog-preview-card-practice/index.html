<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
<link rel="stylesheet" href="./assets/styles.css">
    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>

  <main>
    <div class="content">
      <div class="card">
        <div class="img-container">
          <img
            src="./assets/images/illustration-article.svg"
            alt="imagen of coding simbols"
          />
        </div>
        <div class="status"><p>Learning</p></div>
        <div class="date"></div>
        <div class="title">HTML & CSS foundations</div>
        <div class="description">These languages are the backbone of every website, defining structure, content, and presentation.</div>
        <div class="author">
          <div class="photo">
            <img src="./assets/images/image-avatar.webp" alt="author photo">
          </div>
          <div class="name">Greg Hooper</div>
        </div>
      </div>
    </div>
  </main>
  <body>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
    <script>
      const dateElement = document.querySelector('.date');
      const today = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      const formattedDate = today.toLocaleDateString('es-ES', options);
    
      dateElement.textContent = `Published ${formattedDate}`;
    </script>
  </body>
</html>
